name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JS: lint, unit tests, build ──────────────────────────────────────────
  js:
    name: JS — lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build

  # ── Python: style lint + dataset validation ──────────────────────────────
  python:
    name: Python — flake8 / dataset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install flake8 numpy

      - name: Lint (flake8)
        run: flake8 scripts/ --max-line-length=120 --ignore=E402,W503

      - name: Dataset validation
        run: python scripts/evaluate.py
